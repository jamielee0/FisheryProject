# species_traits.yaml
#
# Source: Populated from Prompt 2 species/threshold analysis (2026-05-25).
# Confidence classes: high = local/regional, species-specific, life-stage-relevant;
#   medium = species-specific but nonlocal, indirect, or not exact life stage;
#   low = generic, borrowed, model-derived, or sensitivity-only;
#   unknown = do not parameterize without expert review.
#
# model_use values:
#   primary_fixed_endpoint       — confirmed for use in main model endpoint construction
#   primary_soft_threshold       — use as soft exposure threshold, not hard cutoff
#   sensitivity_only             — use only in threshold sensitivity analysis
#   sensitivity_only_nonlocal    — nonlocal source; sensitivity only
#   soft_association             — association-based, not a threshold
#   soft_growth_association      — lab growth association, not a field threshold
#   growth_molt_timing_only      — for growth/molt phenology, not danger classification
#   early_life_hatchery_sensitivity — hatchery/early-life lab only
#   generic_screen               — generic regulatory or monitoring screen
#   anomaly_or_percentile_predictor — use as anomaly or percentile covariate, not threshold
#   broad_occurrence_only        — occurrence range only, not optimum
#   qualitative_zone_covariate   — qualitative zone/habitat covariate
#   do_not_use_until_confirmed   — await expert confirmation
#   avoid_for_program195_primary — not suitable for Program 195 primary model
#   productivity_covariate_not_stress — productivity covariate, not a stress threshold
#   spawning_habitat_mask        — use for spawning-season habitat window only
#   oyster_module_only           — only if oyster outcome data confirmed
#
# See also: threshold_table.csv for full row-level threshold data.
# See also: endpoint_verification.md for endpoint status and conflicts.

