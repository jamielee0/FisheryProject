[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trees_to_seas"
version = "0.1.0"
description = "Dynamic habitat stress exposure for North Carolina estuarine fisheries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xarray",
    "netcdf4",
    "geopandas",
    "shapely",
    "pyproj",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]
notebooks = [
    "jupyter",
    "ipykernel",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-config"
cache_dir = "build/.pytest_cache"

[tool.ruff]
src = ["src", "tests"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
